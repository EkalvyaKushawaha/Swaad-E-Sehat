<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Table {{ table_number|default:"01" }} Luxury QR Standee | Swaad-e-Sehat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- QR Styling Library (Supports Gradients, Custom Dots & Center Logo) -->
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    body {
      background: radial-gradient(circle at top, #132a1e 0%, #060e0a 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    /* Luxury Cafe Acrylic Standee Frame */
    .standee-frame {
      width: 380px;
      background: linear-gradient(170deg, rgba(22, 53, 38, 0.95) 0%, rgba(9, 23, 16, 0.98) 100%);
      border: 2px solid #e9c46a;
      border-radius: 32px;
      padding: 42px 30px;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(46, 196, 182, 0.25);
    }

    /* Inner Gold Filigree Outline */
    .standee-frame::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(233, 196, 106, 0.45);
      border-radius: 24px;
      pointer-events: none;
    }

    .cafe-brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .cafe-tagline {
      font-size: 0.78rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #e9c46a;
      font-weight: 600;
      margin-bottom: 24px;
    }

    /* Table Badge */
    .table-badge {
      background: linear-gradient(135deg, #e9c46a 0%, #d4a341 100%);
      color: #06140d;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      padding: 8px 26px;
      border-radius: 50px;
      display: inline-block;
      box-shadow: 0 8px 20px rgba(233, 196, 106, 0.3);
      margin-bottom: 16px;
    }

    /* Luxury QR Container */
    .qr-card-wrap {
      background: #ffffff;
      padding: 16px;
      border-radius: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      margin: 10px 0 22px;
      border: 3px solid rgba(233, 196, 106, 0.4);
    }

    #qr-code {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scan-note {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .scan-subnote {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 0;
    }

    .features-strip {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    .features-strip span i {
      color: #2ec4b6;
      margin-right: 4px;
    }

    /* Print settings */
    @media print {
      body {
        background: transparent !important;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .standee-frame {
        box-shadow: none !important;
        margin: auto;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <!-- Physical Cafe Standee -->
  <div class="standee-frame">
    <div class="cafe-brand">स्वाद-e-सेहत</div>
    <div class="cafe-tagline">Artisanal & Ayurvedic Dining</div>

    <div class="table-badge">
      TABLE {{ table_number|default:"01" }}
    </div>

    <!-- Gradient Center-Logo QR Holder -->
    <div class="qr-card-wrap">
      <div id="qr-code"></div>
    </div>

    <div class="scan-note">Scan with Phone Camera</div>
    <p class="scan-subnote">Instant Digital Menu • Direct Kitchen Order</p>

    <div class="features-strip">
      <span><i class="bi bi-shield-check"></i>No Login</span>
      <span>•</span>
      <span><i class="bi bi-clock-history"></i>Live Prep</span>
      <span>•</span>
      <span><i class="bi bi-check2-circle"></i>Auto Table</span>
    </div>
  </div>

  <!-- Print Actions -->
  <div class="no-print mt-4 text-center">
    <button onclick="window.print()" class="btn btn-warning px-4 py-2 rounded-pill fw-bold shadow">
      <i class="bi bi-printer me-2"></i> Print Table Standee
    </button>
  </div>

  <script>
    // Cafe-Themed Gradient QR Generator
    const targetUrl = "{{ qr_url|default:'http://10.41.21.175:8000/tables/1/' }}";

    const qrCode = new QRCodeStyling({
      width: 230,
      height: 230,
      type: "canvas",
      data: targetUrl,
      // Leaf / Organic Center Logo
      image: "https://cdn-icons-png.flaticon.com/512/892/892926.png",
      dotsOptions: {
        type: "rounded", // smooth rounded dots instead of boring squares
        gradient: {
          type: "linear",
          rotation: 45,
          colorStops: [
            { offset: 0, color: "#0a402d" },  // Deep Ayurvedic Emerald
            { offset: 1, color: "#168178" }   // Premium Turquoise Teal
          ]
        }
      },
      cornersSquareOptions: {
        type: "extra-rounded",
        color: "#b38219" // Warm Antique Gold Corners
      },
      cornersDotOptions: {
        type: "dot",
        color: "#0a402d" // Matching Dark Center Eye
      },
      backgroundOptions: {
        color: "#ffffff"
      },
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 5,
        imageSize: 0.35 // Logo perfectly sized in center
      }
    });

    qrCode.append(document.getElementById("qr-code"));
  </script>
</body>
</html>
